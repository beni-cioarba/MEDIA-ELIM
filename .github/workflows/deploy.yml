name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El número de compilación es `git rev-list --count HEAD`: con el
          # clon superficial por defecto (depth 1) siempre saldría 1.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Angular 22 exige Node ^22.22 || ^24.15 (ver "engines" en package.json).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Puertas de calidad: paridad de traducciones y presupuesto de
      # legibilidad de la proyección. Si fallan, no se publica.
      - name: Checks (i18n parity, projection sizes)
        run: npm run check

      - name: Build (production, base href = /MEDIA-ELIM/)
        run: npx ng build --configuration production --base-href /MEDIA-ELIM/

      - name: Add SPA fallback (404 -> index)
        run: cp dist/iglesia-redes/browser/index.html dist/iglesia-redes/browser/404.html

      - name: Add .nojekyll
        run: touch dist/iglesia-redes/browser/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/iglesia-redes/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
