name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El número de compilación es `git rev-list --count HEAD`: con el
          # clon superficial por defecto (depth 1) siempre saldría 1.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Angular 22 exige Node ^22.22 || ^24.15 (ver "engines" en package.json).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Calendario de suscripción («Abonează-te» de Evenimente): escribe
      # assets/calendars/elim-events.ics desde church.config.ts (eventos +
      # programa semanal). Antes del build, que lo copia con el resto de assets.
      # No se sube al repo. scripts/generate-events-calendar.mjs.
      - name: Events calendar (assets/calendars/elim-events.ics)
        run: npm run calendar:events

      # Puertas de calidad: paridad de traducciones y presupuesto de
      # legibilidad de la proyección. Si fallan, no se publica.
      - name: Checks (i18n parity, projection sizes)
        run: npm run check

      # Proiectul Împreună: refresca la instantánea de vídeos del día desde la
      # API pública de proiectulimpreuna.ro (y los .ics). No bloquea: si su
      # web no responde se publica con la instantánea del repo, y la página
      # completa lo que falte en el navegador. docs/ai/32-impreuna.md.
      - name: Proiectul Împreună (vídeos del día)
        continue-on-error: true
        run: npm run impreuna:sync

      - name: Build (production, base href = / (dominio propio elimarganda.com))
        run: npx ng build --configuration production --base-href /

      - name: Add SPA fallback (404 -> index)
        run: cp dist/iglesia-redes/browser/index.html dist/iglesia-redes/browser/404.html

      # Páginas estáticas por ruta (hoy `invitati/`, destino del QR de
      # bienvenida): responden 200 en vez del 404 del fallback y llevan su
      # propio título / Open Graph / noindex. Ver scripts/generate-route-pages.mjs.
      - name: Route pages (200 + own meta)
        run: node scripts/generate-route-pages.mjs --dist dist/iglesia-redes/browser

      - name: Add .nojekyll
        run: touch dist/iglesia-redes/browser/.nojekyll

      # PDF de «Rugăciune pentru familii» (uno por semana, para el grupo de la
      # iglesia): imprime con el Chrome del runner las mismas diapositivas que
      # se proyectan, sobre la web recién compilada. Deja los PDF y su
      # manifiesto en assets/family-prayer/. No bloquea la publicación: si
      # falla, la web simplemente no ofrece el botón de PDF esa vez.
      - name: Family prayer PDFs
        continue-on-error: true
        env:
          PDF_BROWSER: chrome
        run: npm run pdf:familii -- --dist dist/iglesia-redes/browser

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/iglesia-redes/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
