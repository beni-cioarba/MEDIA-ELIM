<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <!-- Título y descripción ESTÁTICOS: son lo que leen WhatsApp, Facebook y los
       buscadores (no ejecutan JS). `SeoService` los afina por página en el
       navegador. -->
  <title>Biserica Elim Arganda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Biserica Elim din Arganda del Rey: program, anunțuri, transmisiuni în direct, rugăciune pentru familii și donații.">
  <!-- Color de la barra del navegador / de la ventana instalada: el del fondo
       de la cabecera en cada tema, para que se funda con ella. -->
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1f35" media="(prefers-color-scheme: dark)">

  <!-- Iconos (todos generados con `npm run pwa:icons` desde el emblema; ver
       docs/ai/45-design-system.md → Marca): pestaña (silueta sobre navy),
       apple-touch a sangre y, en el manifiesto, any / maskable / monochrome y
       los iconos de los atajos. -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/pwa/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- `default` (texto oscuro): la cabecera es clara; con `black-translucent`
       la hora y la batería salían en blanco sobre blanco. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Elim Arganda">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Vista previa al compartir un enlace (WhatsApp, Facebook, Telegram…). -->
  <meta property="og:site_name" content="Biserica Elim Arganda">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Biserica Elim Arganda">
  <meta property="og:description" content="Program, anunțuri, transmisiuni în direct, rugăciune pentru familii și donații.">
  <meta property="og:image" content="https://elimarganda.com/assets/pwa/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Emblema Bisericii Elim Arganda">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://elimarganda.com/assets/pwa/og-image.jpg">

  <!-- Preconectar al CDN del JSON de YouTube para que el TLS handshake
       no bloquee la primera petición. -->
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>

  <!-- ── Tipografías ────────────────────────────────────────────────
       `preconnect` a los dos hosts de Google Fonts (el CSS y los WOFF2
       viven en dominios distintos: sin esto se pagan 2 handshakes en
       serie). La hoja se pide con `media="print"` + `onload` para que
       NO bloquee el primer pintado; el `<noscript>` cubre el caso sin JS.

       · Plus Jakarta Sans (titulares) + Inter (cuerpo) → tipografía del
         producto. Playfair Display se reduce a los dos pesos que de verdad
         se usan: 600 para el wordmark de la marca y la cursiva 500 para los
         versículos (`display=swap`: preferimos texto con fallback a texto
         invisible).
       · Material Symbols Outlined → catálogo completo de iconos de Google
         para pantallas secundarias. Los iconos críticos de navegación NO
         dependen de esta fuente: son SVG en línea (ver `icon-registry.ts`),
         así que la cabecera se pinta correcta aunque la fuente falle.
         `display=block` evita ver el texto crudo del ligature. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
    media="print"
    onload="this.media='all'">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    media="print"
    onload="this.media='all';document.documentElement.classList.add('fonts-symbols-ready')">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
  </noscript>

  <!-- Preload de la primera diapositiva del hero (LCP de la portada) para que
       el navegador la descargue en paralelo con el JS. Debe coincidir con
       `heroSlides[0]` de `church.config.ts`, **incluido el `imagesrcset`**:
       una precarga con un solo `href` gana siempre al `srcset` de la etiqueta
       —el recurso ya está descargado y el navegador lo reutiliza—, así que un
       móvil seguía bajando la imagen de 1600 px por mucho `srcset` que
       tuviera el `<img>`. Con `imagesrcset`/`imagesizes` la precarga elige el
       mismo ancho que elegiría la etiqueta.
       La marca no se precarga: no hay imagen que cargar (wordmark tipográfico
       y logo INEB en SVG dentro del bundle). -->
  <link rel="preload" as="image"
        href="assets/drive-media/concert_colinde_2025.webp"
        imagesrcset="assets/drive-media/concert_colinde_2025-thumb.webp 480w,
                     assets/drive-media/concert_colinde_2025-960.webp 960w,
                     assets/drive-media/concert_colinde_2025.webp 1600w"
        imagesizes="100vw"
        fetchpriority="high">
</head>
<body>
  <app-root></app-root>
  <script>
    // Aviso de instalación de Chromium: puede llegar antes de que arranque
    // Angular (y del pie, que es diferido). Se guarda aquí y lo recoge
    // PwaInstallService; preventDefault = lo lanzamos nosotros desde el pie.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__elimInstallPrompt = e;
    });
  </script>
  <script>
    // Si la fuente de símbolos ya estaba en caché, el `onload` de arriba
    // puede haberse disparado antes de que existiera <html>. Reafirmamos.
    if (document.fonts) {
      document.fonts.ready.then(function () {
        if (document.fonts.check('24px "Material Symbols Outlined"')) {
          document.documentElement.classList.add('fonts-symbols-ready');
        }
      });
    }
  </script>
</body>
</html>
