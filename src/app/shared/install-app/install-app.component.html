@if (pwa.available()) {
  <!-- Control del pie: icono + verbo. Lo justo para entenderse de un vistazo;
       el nombre completo va al lector de pantalla y al tooltip. -->
  <button
    #button
    type="button"
    class="install"
    [disabled]="launcher.busy()"
    (click)="launcher.start(button)"
    [attr.aria-label]="'install.cta_long' | translate"
    [title]="'install.cta_long' | translate"
    aria-haspopup="dialog"
  >
    <app-icon class="install__icon" name="install-app" />
    <span class="install__label">{{ 'install.cta' | translate }}</span>
  </button>
}
