<section class="meal" aria-labelledby="meal-title">
  <div class="meal__text">
    <p class="meal__kicker">{{ 'departments.youth.meal.kicker' | translate }}</p>
    <h3 class="meal__title" id="meal-title">{{ 'departments.youth.meal.title' | translate }}</h3>
    <p class="meal__lead">{{ 'departments.youth.meal.lead' | translate }}</p>

    <ul class="meal__chips" role="list">
      @for (chip of chips; track chip) {
        <li class="meal__chip">
          {{ 'departments.youth.meal.chips.' + chip | translate }}
        </li>
      }
    </ul>
  </div>
</section>
