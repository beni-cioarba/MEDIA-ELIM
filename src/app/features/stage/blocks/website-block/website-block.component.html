<section class="site" aria-labelledby="site-title">
  <div class="site__text">
    <p class="site__eyebrow">{{ 'website_slide.eyebrow' | translate }}</p>
    <h2 id="site-title" class="site__title">{{ 'website_slide.title' | translate }}</h2>
    <!-- Con el aviso de directo, la misma invitación suma el culto de hoy:
         un solo código y una sola acción; el directo se abre desde la web. -->
    <p class="site__lead">{{ (live() ? 'website_slide.lead_live' : 'website_slide.lead') | translate }}</p>

    <ul class="site__sections" role="list">
      @for (section of sections; track section.labelKey) {
        <li class="site__section">
          <span class="site__section-icon" aria-hidden="true"><app-icon [name]="section.icon" /></span>
          {{ section.labelKey | translate }}
        </li>
      }
    </ul>
  </div>

  <app-qr-panel class="site__qr" [data]="siteUrl" captionKey="website_slide.qr_caption" />
</section>
